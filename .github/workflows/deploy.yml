name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare website
        run: |
          mkdir -p _site/bundles

          rsync -av \
            --exclude='/.*' \
            --exclude='/algorithm/' \
            --exclude='/bundles/' \
            --exclude='/*.md' \
            ./ _site/

      - name: Build classic bundle
        run: |
          {
            printf '"use strict";\n\n'
            cat ./algorithm/* | grep -v '"use strict";'
          } > ./_site/bundles/holo-cube-algorithm.classic.js

      - name: Build ES module bundle
        run: |
          {
            cat ./algorithm/* | grep -v '"use strict";'
            printf '\nexport { Runner };\n'
          } > ./_site/bundles/holo-cube-algorithm.module.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
